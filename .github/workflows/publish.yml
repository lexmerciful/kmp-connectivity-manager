name: Release

# Push a tag `vX.Y.Z` (with a matching `## [X.Y.Z]` section in CHANGELOG.md) to release:
# full CI → Maven Central → GitHub Release with the changelog notes → API docs.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9.]*)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-alpha|-beta|-rcN]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Changelog has an entry
        run: |
          grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section"
            exit 1
          }

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: [ validate, ci ]
    runs-on: macos-latest   # the iOS artifacts need macOS
    timeout-minutes: 60
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Publish and release
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME=${{ needs.validate.outputs.version }} --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  github-release:
    name: GitHub Release
    needs: [ validate, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # The changelog section between "## [VERSION]" and the next "## [".
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease

  docs:
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
