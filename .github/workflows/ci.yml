name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check (tests, ABI)
        run: ./gradlew check checkKotlinAbi --continue
      - name: Build samples
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :sample:androidApp:assembleDebug :sample:desktopApp:compileKotlin :sample:webApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
