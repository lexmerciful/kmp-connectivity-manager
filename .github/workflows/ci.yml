name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the release workflow runs the full CI first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  # JVM, Android host, JS and Wasm (headless Chrome) tests; public API (ABI) check; samples; API docs.
  linux:
    name: Tests, ABI, samples, docs (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests and ABI check
        run: ./gradlew check checkKotlinAbi --continue
      - name: Build samples
        run: >
          ./gradlew
          :sample:androidApp:assembleDebug
          :sample:desktopApp:compileKotlin
          :sample:webApp:wasmJsBrowserDistribution
      - name: API docs
        run: ./gradlew :dokkaGenerate
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-linux
          path: '**/build/reports/'
          retention-days: 7

  # iOS tests on the simulator (real NWPathMonitor), iOS device compilation, the sample framework,
  # and a publication dry run on the same OS the release uses.
  apple:
    name: iOS tests, publication dry run (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --continue
      - name: iOS device compilation and sample framework
        run: ./gradlew compileKotlinIosArm64 :sample:sharedUI:linkDebugFrameworkIosSimulatorArm64
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal -PVERSION_NAME=0.0.0-ci --no-configuration-cache
      - name: Verify publication
        run: scripts/verify-publication.sh 0.0.0-ci --with-ios
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-macos
          path: '**/build/reports/'
          retention-days: 7

  # The desktop source probes real sockets and network interfaces, which differ per OS.
  desktop:
    name: Desktop JVM tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: JVM tests
        run: ./gradlew :connectivity-core:jvmTest :connectivity-compose:jvmTest :connectivity-ktor:jvmTest :connectivity-okhttp:jvmTest --continue
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-desktop-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 7

  # One stable status to require in branch protection.
  ci-passed:
    name: CI passed
    if: always()
    needs: [ linux, apple, desktop ]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          [[ "${{ needs.linux.result }}" == success ]]
          [[ "${{ needs.apple.result }}" == success ]]
          [[ "${{ needs.desktop.result }}" == success ]]
